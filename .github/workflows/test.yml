# [Input] A pushed Admin commit or pull request plus an ephemeral PostgreSQL service.
# [Output] Deterministic config, unit, lint, type, build and immutable Drizzle journal receipts.
# [Pos] GitHub release gate; real providers and normal-database rollout remain explicit operator stages.
# [Sync] 2026-09-16: replace schema push and retired integration target with current release commands.

name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment projections
        run: pnpm test:config

      - name: Run provider-free tests
        run: pnpm test:run

      - name: Run ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build application
        run: pnpm build

  migration-journal:
    name: Drizzle migration journal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "ink_ci_migrator"
          POSTGRES_PASSWORD: "ink_ci_migration_password_2026"
          POSTGRES_DB: "ink_admin_ci"
        options: >-
          --health-cmd "pg_isready -U ink_ci_migrator -d ink_admin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      MIGRATION_DATABASE_URL: "postgresql://ink_ci_migrator:ink_ci_migration_password_2026@127.0.0.1:5432/ink_admin_ci"
      AI_CREDENTIAL_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      AI_PROVIDER_ACCOUNT_IDENTITY_PEPPER: "ink-admin-ci-only-identity-pepper-2026"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the Admin migration workflow
        run: pnpm db:migrate

      - name: Verify the immutable journal
        run: pnpm db:migrate:check

      - name: Verify published auth and Dream capabilities
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const required = new Map([
            ["identity.better-auth.v1", 1],
            ["identity.runtime-delegation.v1", 1],
            ["identity.registration-integrity.v1", 1],
            ["identity.runtime-purpose.v1", 1],
            ["dream.deck-content-canonical-storage.v1", 1],
            ["dream.workflow-preflight-request.v1", 1],
            ["dream.reflection-task-persistence.v1", 1],
            ["identity.runtime-confirmation-claim.v1", 1],
          ]);
          const client = new pg.Client({ connectionString: process.env.MIGRATION_DATABASE_URL });
          await client.connect();
          try {
            const result = await client.query(
              `SELECT capability, version
                 FROM drizzle.schema_capabilities
                WHERE capability = ANY($1::text[])`,
              [[...required.keys()]],
            );
            const actual = new Map(result.rows.map((row) => [row.capability, Number(row.version)]));
            for (const [capability, version] of required) {
              if (actual.get(capability) !== version) {
                throw new Error(`Missing required capability ${capability}@${version}`);
              }
            }
            console.log(`Verified ${required.size} published capabilities.`);
          } finally {
            await client.end();
          }
          NODE

      - name: Prove repeat application is a no-op
        run: pnpm db:migrate
