services:
  ink-memory-admin:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ink_memory}:${POSTGRES_PASSWORD:-ink_memory}@postgres:5432/${POSTGRES_DB:-ink-memory}
    networks:
      - ink-memory-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ink_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ink_memory}
      POSTGRES_DB: ${POSTGRES_DB:-ink-memory}
    networks:
      - ink-memory-network
    volumes:
      - ink_memory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ink_memory} -d ${POSTGRES_DB:-ink-memory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ink_memory_postgres_data:

networks:
  ink-memory-network:
    driver: bridge
