services:
  ink-memory-admin:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ink_memory}:${POSTGRES_PASSWORD:?Run pnpm env:setup from the repository root}@postgres:5432/${POSTGRES_DB:-ink-memory}
      ADMIN_CONSOLE_ENABLED: ${ADMIN_CONSOLE_ENABLED:-true}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Run pnpm env:setup from the repository root}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?Run pnpm env:setup from the repository root}
      ADMIN_ORIGIN_ALLOWLIST: ${ADMIN_ORIGIN_ALLOWLIST:-http://localhost:3000}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:?Run pnpm env:setup from the repository root}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:?Run pnpm env:setup from the repository root}
      AI_PROVIDER_HOST_ALLOWLIST: ${AI_PROVIDER_HOST_ALLOWLIST:-}
      AI_PROVIDER_ALLOW_INSECURE_LOCALHOST: ${AI_PROVIDER_ALLOW_INSECURE_LOCALHOST:-false}
      GATEWAY_MIN_RESERVE_MICROUSD: ${GATEWAY_MIN_RESERVE_MICROUSD:-0}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-20971520}
      ARTIFACT_WORKSPACE_ROOT: ${ARTIFACT_WORKSPACE_ROOT:-/artifacts}
      ARTIFACT_PREVIEW_MAX_FILE_BYTES: ${ARTIFACT_PREVIEW_MAX_FILE_BYTES:-8388608}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-s3}
      FILE_STORAGE_PREFIX: ${FILE_STORAGE_PREFIX:-uploads}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:-ink-memory}
      FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
      FILE_STORAGE_S3_ENDPOINT: ${FILE_STORAGE_S3_ENDPOINT:-http://minio:9000}
      FILE_STORAGE_S3_FORCE_PATH_STYLE: ${FILE_STORAGE_S3_FORCE_PATH_STYLE:-true}
      FILE_STORAGE_S3_PUBLIC_BASE_URL: ${FILE_STORAGE_S3_PUBLIC_BASE_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    networks:
      - ink-memory-network
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ink_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:setup from the repository root}
      POSTGRES_DB: ${POSTGRES_DB:-ink-memory}
    networks:
      - ink-memory-network
    volumes:
      - ink_memory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ink_memory} -d ${POSTGRES_DB:-ink-memory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ink_memory}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run pnpm env:setup from the repository root}
    networks:
      - ink-memory-network
    volumes:
      - ink_memory_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set ink-memory http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb ink-memory/$$MINIO_BUCKET --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ink_memory}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run pnpm env:setup from the repository root}
      MINIO_BUCKET: ${FILE_STORAGE_S3_BUCKET:-ink-memory}
    networks:
      - ink-memory-network

volumes:
  ink_memory_postgres_data:
  ink_memory_storage_data:

networks:
  ink-memory-network:
    driver: bridge
