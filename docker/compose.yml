# Docker Compose for vibesales-service-motia
# Adapted from cgoinglove/better-chatbot
#
# Quick Start:
#   docker compose -f docker/compose.yml up -d postgres
#   docker compose -f docker/compose.yml up -d minio
#
# Default credentials (work out-of-box, no .env needed):
#   PostgreSQL:
#     User: postgres
#     Password: postgres  
#     Database: vibesales
#     URL: postgres://postgres:postgres@localhost:5432/vibesales
#
#   MinIO (S3-compatible storage):
#     User: minioadmin
#     Password: minioadmin
#     Console: http://localhost:9001
#     Endpoint: http://localhost:9000
#     Bucket: vibesales (created automatically)

services:
  # PostgreSQL database
  postgres:
    image: postgres:16
    container_name: ai4sales-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ai4sales
      POSTGRES_USER: ai4sales
      POSTGRES_PASSWORD: ai4sales
    volumes:
      - ai4sales_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai4sales"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for session/cache management (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ai4sales-networks
    volumes:
      - ai4sales_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible file storage
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - ai4sales_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai4sales-networks
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/$${MINIO_BUCKET:-vibesales} --ignore-existing;
      mc anonymous set download myminio/$${MINIO_BUCKET:-vibesales};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vibesales}
    networks:
      - ai4sales-networks

volumes:
  ai4sales_pgdata:
  ai4sales_redis_data:
  ai4sales_minio_data:

networks:
  ai4sales-networks:
    driver: bridge
