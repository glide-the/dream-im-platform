# [Input] docker/.env secrets, managed Provider registrations, and local topology settings.
# [Output] One local Admin container with embedded PostgreSQL and optional product OAuth capability.
# [Pos] Local container parity path for the production single-container architecture.
# [Sync] 2026-09-17: pass the independent Admin Session lifetime with unified auth/data configuration.
# [Sync] 2026-09-04: pass optional Codex/xAI/Copilot product-profile overrides and credential key-id settings.
services:
  ink-memory-admin:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-2}
        NEXT_BUILD_MAX_OLD_SPACE_MB: ${NEXT_BUILD_MAX_OLD_SPACE_MB:-2048}
    ports:
      - "${APP_PORT:-3000}:3000"
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      INK_DATABASE_MODE: embedded-postgres
      EMBEDDED_POSTGRES_DATA_DIR: /var/lib/ink-memory/postgres
      EMBEDDED_POSTGRES_PORT: "5432"
      EMBEDDED_POSTGRES_SHARED_BUFFERS: ${EMBEDDED_POSTGRES_SHARED_BUFFERS:-96MB}
      EMBEDDED_POSTGRES_MAX_CONNECTIONS: ${EMBEDDED_POSTGRES_MAX_CONNECTIONS:-50}
      POSTGRES_USER: ${POSTGRES_USER:-ink_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:setup from the repository root}
      POSTGRES_DB: ${POSTGRES_DB:-ink-memory}
      DATABASE_URL: postgres://${POSTGRES_USER:-ink_memory}:${POSTGRES_PASSWORD:?Run pnpm env:setup from the repository root}@127.0.0.1:5432/${POSTGRES_DB:-ink-memory}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-ink_memory}:${POSTGRES_PASSWORD:?Run pnpm env:setup from the repository root}@127.0.0.1:5432/${POSTGRES_DB:-ink-memory}
      ADMIN_CONSOLE_ENABLED: ${ADMIN_CONSOLE_ENABLED:-true}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Run pnpm env:setup from the repository root}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?Run pnpm env:setup from the repository root}
      ADMIN_ORIGIN_ALLOWLIST: ${ADMIN_ORIGIN_ALLOWLIST:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Configure unified authentication}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run pnpm env:setup and configure unified authentication}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?Configure the limited auth role DSN}
      ADMIN_CONTROL_DATABASE_URL: ${ADMIN_CONTROL_DATABASE_URL:?Configure the limited control role DSN}
      DREAM_DATA_DATABASE_URL: ${DREAM_DATA_DATABASE_URL:?Configure the limited Dream data role DSN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Configure the Admin Google OAuth client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Configure the Admin Google OAuth secret}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Configure exact Admin and Dream origins}
      DREAM_API_RESOURCE: ${DREAM_API_RESOURCE:?Configure the exact Dream API resource}
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:?Run pnpm env:setup}
      AUTH_DEVICE_CLIENT_ID: ${AUTH_DEVICE_CLIENT_ID:?Configure the public Device client}
      DREAM_DATA_SERVICE_CLIENTS: ${DREAM_DATA_SERVICE_CLIENTS:?Configure registered Dream service clients}
      DREAM_GATEWAY_CLIENT_BINDINGS: ${DREAM_GATEWAY_CLIENT_BINDINGS:?Configure provisioned Gateway bindings}
      AUTH_BROWSER_SESSION_TTL_SECONDS: ${AUTH_BROWSER_SESSION_TTL_SECONDS:-2592000}
      AUTH_REFRESH_SKEW_SECONDS: ${AUTH_REFRESH_SKEW_SECONDS:-30}
      AUTH_RUNTIME_DELEGATION_TTL_SECONDS: ${AUTH_RUNTIME_DELEGATION_TTL_SECONDS:-300}
      AUTH_RUNTIME_DELEGATION_MAX_TTL_SECONDS: ${AUTH_RUNTIME_DELEGATION_MAX_TTL_SECONDS:-3600}
      AUTH_REFLECTIONS_AUTHORITY_TTL_SECONDS: ${AUTH_REFLECTIONS_AUTHORITY_TTL_SECONDS:-300}
      AUTH_REFLECTIONS_AUTHORITY_MAX_TTL_SECONDS: ${AUTH_REFLECTIONS_AUTHORITY_MAX_TTL_SECONDS:-3600}
      AUTH_BCRYPT_COST: ${AUTH_BCRYPT_COST:-12}
      AUTH_MAX_BODY_BYTES: ${AUTH_MAX_BODY_BYTES:-16384}
      AUTH_PGPOOL_MAX: ${AUTH_PGPOOL_MAX:-10}
      DREAM_DATA_PGPOOL_MAX: ${DREAM_DATA_PGPOOL_MAX:-10}
      DREAM_DATA_MAX_BODY_BYTES: ${DREAM_DATA_MAX_BODY_BYTES:-1048576}
      DREAM_DOMAIN_CANONICAL_TIMEOUT_MS: ${DREAM_DOMAIN_CANONICAL_TIMEOUT_MS:-10000}
      DREAM_WORKSPACE_PLUGIN_POLICY_JSON: ${DREAM_WORKSPACE_PLUGIN_POLICY_JSON:?Configure Story Workspace plugin policy}
      DREAM_RUNTIME_ACTIVATION_POLICY_JSON: ${DREAM_RUNTIME_ACTIVATION_POLICY_JSON:?Configure Runtime activation policy}
      DREAM_DECK_POLICY_JSON: ${DREAM_DECK_POLICY_JSON:?Configure Deck policy}
      DREAM_REFLECTION_REPORT_LIST_MAX_ROWS: ${DREAM_REFLECTION_REPORT_LIST_MAX_ROWS:-100}
      DREAM_REFLECTIONS_LAUNCH_SNAPSHOT_MAX_BYTES: ${DREAM_REFLECTIONS_LAUNCH_SNAPSHOT_MAX_BYTES:-1048576}
      DREAM_REFLECTIONS_WORKSPACE_ROOT: ${DREAM_REFLECTIONS_WORKSPACE_ROOT:-/artifacts/reflections}
      DREAM_FRIENDSHIP_POLICY_JSON: ${DREAM_FRIENDSHIP_POLICY_JSON:?Configure friendship policy}
      DREAM_CONFIRMATION_DISPATCH_LEASE_SECONDS: ${DREAM_CONFIRMATION_DISPATCH_LEASE_SECONDS:-120}
      INK_WORKFLOW_TOKEN_SECRET: ${INK_WORKFLOW_TOKEN_SECRET:?Run pnpm env:setup}
      DREAM_PREFLIGHT_TOKEN_TTL_SECONDS: ${DREAM_PREFLIGHT_TOKEN_TTL_SECONDS:-300}
      DREAM_PREFLIGHT_MAX_INPUT_BYTES: ${DREAM_PREFLIGHT_MAX_INPUT_BYTES:-65536}
      INK_DECK_HOST_COMPATIBLE: ${INK_DECK_HOST_COMPATIBLE:?Configure compatibility fact}
      INK_CLAUDE_AGENT_CONTRACT_COMPATIBLE: ${INK_CLAUDE_AGENT_CONTRACT_COMPATIBLE:?Configure compatibility fact}
      INK_STORY_SCHEMA_COMPATIBLE: ${INK_STORY_SCHEMA_COMPATIBLE:?Configure compatibility fact}
      INK_DECK_RUNTIME_CONFIG_COMPATIBLE: ${INK_DECK_RUNTIME_CONFIG_COMPATIBLE:?Configure compatibility fact}
      DREAM_WORKFLOW_CONTEXT_MAX_ATTEMPTS: ${DREAM_WORKFLOW_CONTEXT_MAX_ATTEMPTS:-256}
      DREAM_CHAT_AUTO_TITLE_MAX_CHARACTERS: ${DREAM_CHAT_AUTO_TITLE_MAX_CHARACTERS:-50}
      GATEWAY_IMAGE_INPUT_TOKEN_ESTIMATE: ${GATEWAY_IMAGE_INPUT_TOKEN_ESTIMATE:-4784}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:?Run pnpm env:setup from the repository root}
      GATEWAY_SUBJECT_JWT_ISSUER: ${GATEWAY_SUBJECT_JWT_ISSUER:-ink-dream-memory}
      GATEWAY_SUBJECT_JWT_AUDIENCE: ${GATEWAY_SUBJECT_JWT_AUDIENCE:-ink-memory-admin-gateway}
      PRODUCT_API_JWT_SECRET: ${PRODUCT_API_JWT_SECRET:?Run pnpm env:setup from the repository root}
      PRODUCT_API_JWT_ISSUER: ${PRODUCT_API_JWT_ISSUER:-ink-dream-memory}
      PRODUCT_API_JWT_AUDIENCE: ${PRODUCT_API_JWT_AUDIENCE:-ink-memory-product-api}
      PRODUCT_API_ORIGIN_ALLOWLIST: ${PRODUCT_API_ORIGIN_ALLOWLIST:-http://127.0.0.1:5173}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:?Run pnpm env:setup from the repository root}
      AI_CREDENTIAL_ENCRYPTION_KEY_ID: ${AI_CREDENTIAL_ENCRYPTION_KEY_ID:-}
      AI_PROVIDER_ACCOUNT_IDENTITY_PEPPER: ${AI_PROVIDER_ACCOUNT_IDENTITY_PEPPER:?Run pnpm env:setup from the repository root}
      INK_PROVIDER_CODEX_CLIENT_ID: ${INK_PROVIDER_CODEX_CLIENT_ID:-}
      INK_PROVIDER_CODEX_SCOPES: ${INK_PROVIDER_CODEX_SCOPES:-}
      INK_PROVIDER_CODEX_USER_AGENT: ${INK_PROVIDER_CODEX_USER_AGENT:-}
      INK_PROVIDER_CODEX_INTEGRATION_ID: ${INK_PROVIDER_CODEX_INTEGRATION_ID:-}
      INK_PROVIDER_CODEX_INTEGRATION_VERSION: ${INK_PROVIDER_CODEX_INTEGRATION_VERSION:-}
      INK_PROVIDER_CODEX_MODEL_CATALOG_CLIENT_VERSION: ${INK_PROVIDER_CODEX_MODEL_CATALOG_CLIENT_VERSION:-}
      INK_PROVIDER_CODEX_MODELS_ENDPOINT: ${INK_PROVIDER_CODEX_MODELS_ENDPOINT:-}
      INK_PROVIDER_XAI_CLIENT_ID: ${INK_PROVIDER_XAI_CLIENT_ID:-}
      INK_PROVIDER_XAI_SCOPES: ${INK_PROVIDER_XAI_SCOPES:-}
      INK_PROVIDER_XAI_USER_AGENT: ${INK_PROVIDER_XAI_USER_AGENT:-}
      INK_PROVIDER_XAI_ISSUER: ${INK_PROVIDER_XAI_ISSUER:-}
      INK_PROVIDER_XAI_MODELS_ENDPOINT: ${INK_PROVIDER_XAI_MODELS_ENDPOINT:-}
      INK_PROVIDER_GITHUB_COPILOT_CLIENT_ID: ${INK_PROVIDER_GITHUB_COPILOT_CLIENT_ID:-}
      INK_PROVIDER_GITHUB_COPILOT_CLIENT_SECRET: ${INK_PROVIDER_GITHUB_COPILOT_CLIENT_SECRET:-}
      INK_PROVIDER_GITHUB_COPILOT_SCOPES: ${INK_PROVIDER_GITHUB_COPILOT_SCOPES:-}
      INK_PROVIDER_GITHUB_COPILOT_USER_AGENT: ${INK_PROVIDER_GITHUB_COPILOT_USER_AGENT:-}
      INK_PROVIDER_GITHUB_COPILOT_INTEGRATION_ID: ${INK_PROVIDER_GITHUB_COPILOT_INTEGRATION_ID:-}
      INK_PROVIDER_GITHUB_COPILOT_EDITOR_VERSION: ${INK_PROVIDER_GITHUB_COPILOT_EDITOR_VERSION:-}
      INK_PROVIDER_GITHUB_COPILOT_EDITOR_PLUGIN_VERSION: ${INK_PROVIDER_GITHUB_COPILOT_EDITOR_PLUGIN_VERSION:-}
      INK_PROVIDER_GITHUB_COPILOT_API_VERSION: ${INK_PROVIDER_GITHUB_COPILOT_API_VERSION:-}
      INK_PROVIDER_GITHUB_COPILOT_MODELS_ENDPOINT: ${INK_PROVIDER_GITHUB_COPILOT_MODELS_ENDPOINT:-}
      AI_PROVIDER_HOST_ALLOWLIST: ${AI_PROVIDER_HOST_ALLOWLIST:-}
      AI_PROVIDER_ALLOW_INSECURE_LOCALHOST: ${AI_PROVIDER_ALLOW_INSECURE_LOCALHOST:-false}
      GATEWAY_MIN_RESERVE_MICROUSD: ${GATEWAY_MIN_RESERVE_MICROUSD:-0}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-20971520}
      ARTIFACT_WORKSPACE_ROOT: ${ARTIFACT_WORKSPACE_ROOT:-/artifacts}
      ARTIFACT_PREVIEW_MAX_FILE_BYTES: ${ARTIFACT_PREVIEW_MAX_FILE_BYTES:-8388608}
      FILE_STORAGE_TYPE: disabled
      RUN_DB_MIGRATIONS: "false"
    volumes:
      - ink_memory_postgres_data:/var/lib/ink-memory/postgres
      - ink_memory_artifact_data:/artifacts
    networks:
      ink-memory-network:
        aliases:
          - ink-memory-postgres
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  ink_memory_postgres_data:
  ink_memory_artifact_data:

networks:
  ink-memory-network:
    driver: bridge
