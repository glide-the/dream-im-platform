# ============================================
# ai4sales-pwa-app — Docker Compose
# ============================================
# Usage:
#   cd docker
#   cp .env.example .env  (edit .env with real values)
#   docker compose up -d --build
# ============================================

services:
  # ---- Next.js Application ----
  ai4sales-app:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["node", "server.js"]
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ai4sales-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./agent_workspaces:/app/agent-workspaces
      - ./.claude:/app/.claude
    restart: unless-stopped

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai4sales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai4sales}
      POSTGRES_DB: ${POSTGRES_DB:-ai4sales}
    networks:
      - ai4sales-network
    volumes:
      - ai4sales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai4sales}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ai4sales_postgres_data:

networks:
  ai4sales-network:
    driver: bridge
