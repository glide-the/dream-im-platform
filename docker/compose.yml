# ============================================
# ai4sales-pwa-app — Docker Compose
# ============================================
# Usage:
#   cd docker
#   cp .env.example .env  (edit .env with real values)
#   docker compose up -d --build
# ============================================

services:
  # ---- Next.js Application ----
  ai4sales-app:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["node", "server.js"]
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ai4sales-network
    volumes:
      - ./agent_workspaces:/app/agent-workspaces
      - ./.claude:/app/.claude
    restart: unless-stopped


networks:
  ai4sales-network:
    driver: bridge
